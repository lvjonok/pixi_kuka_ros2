# Overlay on controllers.yaml for launch tool:=umi: the Cartesian endpoint is the wrist camera,
# lbr_umi_camera, so /lbr/current_pose and /lbr/target_pose are camera poses.
#
# Nothing that speaks lbr_link_ee may command /lbr/target_pose under this overlay: it would put
# the camera where it meant the flange, about 90 mm and 25 deg away.
#
# The frame is iris_robots_description's CAD value, not a hand-eye measurement.

# The wrench is estimated at the tweezer tips, where contact happens; lbr_umi_tweezer_tip has
# lbr_umi_camera's orientation. The estimator applies its force thresholds as a dead zone before
# a consumer can subtract a bias, so they are zero here and the dead zone is the consumer's.
/**/estimated_wrench_interface:
  ros__parameters:
    wrench_estimator:
      chain_tip: lbr_umi_tweezer_tip
      force_x_th: 0.0
      force_y_th: 0.0
      force_z_th: 0.0

/**/force_torque_broadcaster:
  ros__parameters:
    frame_id: lbr_umi_tweezer_tip

/**/pose_broadcaster:
  ros__parameters:
    end_effector_frame: lbr_umi_camera

/**/twist_broadcaster:
  ros__parameters:
    end_effector_frame: lbr_umi_camera

/**/fri_position_passthrough_controller:
  ros__parameters:
    end_effector_frame: lbr_umi_camera

/**/cartesian_impedance_controller:
  ros__parameters:
    end_effector_frame: lbr_umi_camera

    # Rotational stiffness above 100 needs patches/crisp_controllers-rotational-stiffness-ceiling.patch.
    task:
      k_pos_x: 4000.0
      k_pos_y: 4000.0
      k_pos_z: 4000.0
      d_pos_x: 200.0
      d_pos_y: 200.0
      d_pos_z: 200.0
      k_rot_x: 250.0
      k_rot_y: 250.0
      k_rot_z: 250.0
      d_rot_x: 25.0
      d_rot_y: 25.0
      d_rot_z: 25.0
    variable_max_stiffness:
      translational: 4000.0
      rotational: 250.0
    filter:
      target_pose: 0.9
    # Off: error_clip does not bound the task force under this overlay.
    limit_error: false
