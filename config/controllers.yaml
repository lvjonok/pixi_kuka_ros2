# FRI's torque command is a joint position plus a torque overlay. CRISP claims only the effort
# interfaces, so fri_position_passthrough_controller must be active whenever a CRISP controller
# is. zero_effort_controller owns the effort interfaces otherwise.
/**/controller_manager:
  ros__parameters:
    update_rate: 500
    # ros2_control's command limiter throws on a command interface that is still empty in the
    # first cycle, and the controller manager then deactivates the controller. lbr_fri_ros2's
    # command guard checks every command either way.
    enforce_command_limits: false

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    forward_position_controller:
      type: position_controllers/JointGroupPositionController

    estimated_wrench_interface:
      type: lbr_ros2_control/EstimatedWrenchInterface

    lbr_state_broadcaster:
      type: lbr_ros2_control/LBRStateBroadcaster

    force_torque_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    fri_position_passthrough_controller:
      type: pixi_kuka_ros2/FRIPositionPassthroughController

    # The name is fixed: crisp_py's JointTrajectoryControllerClient hardcodes the action
    # "joint_trajectory_controller/follow_joint_trajectory".
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    zero_effort_controller:
      type: pixi_kuka_ros2/ZeroEffortController

    pose_broadcaster:
      type: crisp_controllers/PoseBroadcaster

    twist_broadcaster:
      type: crisp_controllers/TwistBroadcaster

    cartesian_impedance_controller:
      type: crisp_controllers/CartesianController

    joint_impedance_controller:
      type: crisp_controllers/CartesianController

/**/forward_position_controller:
  ros__parameters:
    joints:
      - lbr_A1
      - lbr_A2
      - lbr_A3
      - lbr_A4
      - lbr_A5
      - lbr_A6
      - lbr_A7
    interface_name: position

/**/estimated_wrench_interface:
  ros__parameters:
    robot_name: lbr
    wrench_estimator:
      chain_root: lbr_link_0
      chain_tip: lbr_link_ee
      damping: 0.2
      force_x_th: 2.0
      force_y_th: 2.0
      force_z_th: 2.0
      torque_x_th: 0.5
      torque_y_th: 0.5
      torque_z_th: 0.5

/**/lbr_state_broadcaster:
  ros__parameters:
    robot_name: lbr

/**/force_torque_broadcaster:
  ros__parameters:
    frame_id: lbr_link_ee
    sensor_name: estimated_wrench_interface

/**/fri_position_passthrough_controller:
  ros__parameters:
    joints:
      - lbr_A1
      - lbr_A2
      - lbr_A3
      - lbr_A4
      - lbr_A5
      - lbr_A6
      - lbr_A7

    # What the FRI position field carries under the torque overlay (docs/position_source.md);
    # Sunrise's joint spring is centred on it. lagged and ik_target are not validated on the cell.
    position_source: measured
    lag_time_constant_s: 0.008
    target_topic: target_pose
    # As cartesian_impedance_controller's end_effector_frame and filter.target_pose.
    end_effector_frame: lbr_link_ee
    base_frame: lbr_link_0
    target_filter: 0.9
    target_timeout_s: 0.1
    ik_damping: 0.01
    nullspace_gain: 0.05
    joint_limit_margin_rad: 0.05
    max_joint_step_rad: [0.004, 0.004, 0.004, 0.004, 0.004, 0.004, 0.004]
    # Not read from the robot: it must be the Sunrise app's joint stiffness. |q_out - q_meas| is
    # held under max_spring_torque_nm / sunrise_joint_stiffness.
    sunrise_joint_stiffness: [200.0, 200.0, 200.0, 200.0, 200.0, 200.0, 200.0]
    max_spring_torque_nm: [10.0, 10.0, 10.0, 8.0, 5.0, 5.0, 3.0]

/**/joint_trajectory_controller:
  ros__parameters:
    joints:
      - lbr_A1
      - lbr_A2
      - lbr_A3
      - lbr_A4
      - lbr_A5
      - lbr_A6
      - lbr_A7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # Sunrise tracks the commanded position with a joint impedance, not a stiff servo: a tight
    # goal tolerance would abort moves that arrived.
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 5.0
    allow_partial_joints_goal: false
    open_loop_control: false

/**/zero_effort_controller:
  ros__parameters:
    joints:
      - lbr_A1
      - lbr_A2
      - lbr_A3
      - lbr_A4
      - lbr_A5
      - lbr_A6
      - lbr_A7

/**/pose_broadcaster:
  ros__parameters:
    joints:
      - lbr_A1
      - lbr_A2
      - lbr_A3
      - lbr_A4
      - lbr_A5
      - lbr_A6
      - lbr_A7
    end_effector_frame: lbr_link_ee
    base_frame: lbr_link_0

/**/twist_broadcaster:
  ros__parameters:
    joints:
      - lbr_A1
      - lbr_A2
      - lbr_A3
      - lbr_A4
      - lbr_A5
      - lbr_A6
      - lbr_A7
    end_effector_frame: lbr_link_ee
    base_frame: lbr_link_0

/**/cartesian_impedance_controller:
  ros__parameters:
    joints:
      - lbr_A1
      - lbr_A2
      - lbr_A3
      - lbr_A4
      - lbr_A5
      - lbr_A6
      - lbr_A7
    end_effector_frame: lbr_link_ee
    base_frame: lbr_link_0

    filter:
      # crisp's weight on the previous value: 0.9 ramps a step of the target over about 20 ms.
      target_pose: 0.9
      q: 0.2
      dq: 0.2
      q_ref: 0.2
      output_torque: 0.2

    task:
      k_pos_x: 1300.0
      k_pos_y: 1300.0
      k_pos_z: 1300.0
      k_rot_x: 60.0
      k_rot_y: 60.0
      k_rot_z: 60.0

      d_pos_x: 84.0
      d_pos_y: 84.0
      d_pos_z: 84.0
      d_rot_x: 15.5
      d_rot_y: 15.5
      d_rot_z: 15.5

      # With limit_error true the task force is at most error_clip x k per axis: 26 N, 3 Nm.
      error_clip:
        x: 0.02
        y: 0.02
        z: 0.02
        rx: 0.05
        ry: 0.05
        rz: 0.05

    nullspace:
      stiffness: 30.0
      damping: 11.0
      max_tau: 14.0

    joint_limit_repulsion:
      enabled: true
      safe_range: 0.25
      max_torque: 22.0

    # crisp clamps task.k_pos_* and task.k_rot_* to these.
    variable_max_stiffness:
      translational: 1300.0
      rotational: 60.0

    max_delta_tau: 2.0
    limit_error: true
    limit_torques: true
    use_friction: false
    # FRI torque commands are overlays on Sunrise's joint impedance controller, which already
    # compensates the robot's dynamics.
    use_coriolis_compensation: false
    use_gravity_compensation: false
    use_local_jacobian: true

    # The controller publishes nothing itself: its terms are read from
    # /lbr/controller_manager/introspection_data. crisp reads this parameter in on_configure only.
    enable_introspection: true

/**/joint_impedance_controller:
  ros__parameters:
    joints:
      - lbr_A1
      - lbr_A2
      - lbr_A3
      - lbr_A4
      - lbr_A5
      - lbr_A6
      - lbr_A7
    end_effector_frame: lbr_link_ee
    base_frame: lbr_link_0

    filter:
      q: 0.2
      dq: 0.2
      q_ref: 0.2
      target_pose: 0.1
      output_torque: 0.2

    # Zero task gains and projector_type none: the nullspace term is the whole law, a joint
    # impedance of stiffness x weight per joint (100, 100, 75, 75, 40, 25, 15 Nm/rad).
    task:
      k_pos_x: 0.0
      k_pos_y: 0.0
      k_pos_z: 0.0
      k_rot_x: 0.0
      k_rot_y: 0.0
      k_rot_z: 0.0

    nullspace:
      stiffness: 5.0
      damping: 2.0
      projector_type: none
      max_tau: 20.0
      weights:
        lbr_A1.value: 20.0
        lbr_A2.value: 20.0
        lbr_A3.value: 15.0
        lbr_A4.value: 15.0
        lbr_A5.value: 8.0
        lbr_A6.value: 5.0
        lbr_A7.value: 3.0

    joint_limit_repulsion:
      enabled: true
      safe_range: 0.15
      max_torque: 3.0

    # Nm per joint per control cycle.
    max_delta_tau: 2.0
    limit_error: false
    limit_torques: true
    use_friction: false
    use_coriolis_compensation: false
    use_gravity_compensation: false
    use_local_jacobian: true

    enable_introspection: true
