# Controller configuration for lbr-stack's default robot_name "lbr".
#
# The KUKA FRI torque command is a position command plus a torque overlay. CRISP
# claims only the effort interfaces, so the position passthrough controller must
# remain active while a CRISP controller is active. The zero-effort controller
# is the safe counterpart used in atomic controller switches.
/**/controller_manager:
  ros__parameters:
    update_rate: 500
    # LBR-Stack's safe-stop command guard remains authoritative. The Jazzy
    # controller-manager limiter currently throws on GenericSystem's empty
    # first-cycle optional and is therefore disabled here.
    enforce_command_limits: false

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    forward_position_controller:
      type: position_controllers/JointGroupPositionController

    estimated_wrench_interface:
      type: lbr_ros2_control/EstimatedWrenchInterface

    lbr_state_broadcaster:
      type: lbr_ros2_control/LBRStateBroadcaster

    force_torque_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    fri_position_passthrough_controller:
      type: pixi_kuka_ros2/FRIPositionPassthroughController

    # Point-to-point moves, used to reach the home configuration. It claims the
    # same position command interfaces as the passthrough controller, so exactly
    # one of the two may be active. See scripts/kuka_crisp.py::move_to_home.
    # The name is fixed: crisp_py's JointTrajectoryControllerClient hardcodes the
    # action as "joint_trajectory_controller/follow_joint_trajectory".
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    zero_effort_controller:
      type: pixi_kuka_ros2/ZeroEffortController

    pose_broadcaster:
      type: crisp_controllers/PoseBroadcaster

    twist_broadcaster:
      type: crisp_controllers/TwistBroadcaster

    cartesian_impedance_controller:
      type: crisp_controllers/CartesianController

    joint_impedance_controller:
      type: crisp_controllers/CartesianController

/**/forward_position_controller:
  ros__parameters:
    joints:
      - lbr_A1
      - lbr_A2
      - lbr_A3
      - lbr_A4
      - lbr_A5
      - lbr_A6
      - lbr_A7
    interface_name: position

/**/estimated_wrench_interface:
  ros__parameters:
    robot_name: lbr
    wrench_estimator:
      chain_root: lbr_link_0
      chain_tip: lbr_link_ee
      damping: 0.2
      force_x_th: 2.0
      force_y_th: 2.0
      force_z_th: 2.0
      torque_x_th: 0.5
      torque_y_th: 0.5
      torque_z_th: 0.5

/**/lbr_state_broadcaster:
  ros__parameters:
    robot_name: lbr

/**/force_torque_broadcaster:
  ros__parameters:
    frame_id: lbr_link_ee
    sensor_name: estimated_wrench_interface

/**/fri_position_passthrough_controller:
  ros__parameters:
    joints:
      - lbr_A1
      - lbr_A2
      - lbr_A3
      - lbr_A4
      - lbr_A5
      - lbr_A6
      - lbr_A7

/**/joint_trajectory_controller:
  ros__parameters:
    joints:
      - lbr_A1
      - lbr_A2
      - lbr_A3
      - lbr_A4
      - lbr_A5
      - lbr_A6
      - lbr_A7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # The commanded position goes to FRI, which hands it to Sunrise's joint
    # impedance controller at 200 Nm/rad. Tolerances are therefore on the
    # impedance-tracked position, not on a stiff position servo, and a tight
    # goal tolerance would abort moves that in fact arrived.
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 5.0
    allow_partial_joints_goal: false
    open_loop_control: false

/**/zero_effort_controller:
  ros__parameters:
    joints:
      - lbr_A1
      - lbr_A2
      - lbr_A3
      - lbr_A4
      - lbr_A5
      - lbr_A6
      - lbr_A7

/**/pose_broadcaster:
  ros__parameters:
    joints:
      - lbr_A1
      - lbr_A2
      - lbr_A3
      - lbr_A4
      - lbr_A5
      - lbr_A6
      - lbr_A7
    end_effector_frame: lbr_link_ee
    base_frame: lbr_link_0

/**/twist_broadcaster:
  ros__parameters:
    joints:
      - lbr_A1
      - lbr_A2
      - lbr_A3
      - lbr_A4
      - lbr_A5
      - lbr_A6
      - lbr_A7
    end_effector_frame: lbr_link_ee
    base_frame: lbr_link_0

/**/cartesian_impedance_controller:
  ros__parameters:
    joints:
      - lbr_A1
      - lbr_A2
      - lbr_A3
      - lbr_A4
      - lbr_A5
      - lbr_A6
      - lbr_A7
    end_effector_frame: lbr_link_ee
    base_frame: lbr_link_0

    filter:
      target_pose: 0.1
      q: 0.2
      dq: 0.2
      q_ref: 0.2
      output_torque: 0.2

    # Teleoperation gains, 16 Sep 2026. Raised from 500/20 because the arm lagged the
    # operator's hand, and that sluggishness has a published number attached: Takagi et al.
    # (arXiv 2605.07037) ran a human-in-the-loop stiffness sweep on two 7-DOF Frankas and
    # found error rising sharply below 400 N/m, with degradation "evident for compliance
    # values smaller than 600 N/m". 500 sat below that knee.
    #
    # crisp's variable_max_stiffness clamps at 900/60 by default (cartesian_controller.yaml:333,
    # 339), silently and with only a throttled warning — so raising k_pos past 900 does nothing
    # unless variable_max_stiffness is raised with it (below, after `nullspace`).
    #
    # Real-hardware precedent on this arm class: idra-lab/kuka_lbr_control runs 1000/30 on a
    # real iiwa over FRI torque; arXiv 2509.19696 teleoperates an iiwa from hand tracking at
    # 800 N/m / 150 Nm/rad; matthias-mayr reports up to 1000 N/m "very stable" on real iiwas.
    #
    # 1300 for excitation, 19 Sep 2026. Session 20260919-135802 (900 N/m, speed 1.0) aborted
    # at 36%: A1 and A2 sat at dq=0 while the tip error grew to 40 mm, and J^T K e reproduced
    # the logged tau_task (A1 5.4 vs 5.0 Nm) -- at that pose the lever along the error was
    # 0.30 m (run median 0.52), so 36 N gave the shoulder ~5 Nm, under its breakaway. 1300
    # breaks the same stall at ~28 mm instead of sitting at 40. Rotational gains unchanged.
    task:
      k_pos_x: 1300.0
      k_pos_y: 1300.0
      k_pos_z: 1300.0
      k_rot_x: 60.0
      k_rot_y: 60.0
      k_rot_z: 60.0

      # NOT the 2*sqrt(k) convention, and deliberately below what a free-oscillation
      # analysis alone would ask for, because two measurements pull opposite ways.
      #
      # Identified Franka end-effector dynamics (4.21 kg apparent inertia, 10.73 Ns/m
      # viscous) put zeta=1 at K=1000 near B=131, where the convention gives 63 — so
      # 2*sqrt(k) under-damps by about 2x, and the failure mode is a ~2 Hz resonance that
      # feels bouncy rather than instability. The iiwa14 is heavier, so the factor is worse.
      #
      # Against that: crisp damps against MEASURED end-effector velocity with the target
      # velocity implicitly zero (cartesian_controller.cpp:172-174), so every Ns/m here
      # fights the operator's hand directly. van den Brandt et al. (arXiv 2603.25418) hit
      # exactly this on a Quest-driven Franka teleop and fixed it with velocity feedforward
      # rather than with stiffness.
      #
      # 70 is the compromise. If it feels bouncy, raise toward 110; if it feels heavy, the
      # real fix is feedforward in the controller, not a smaller number here.
      #
      # 84 = 70 * sqrt(1300/900): same damping ratio at the raised k_pos (19 Sep 2026).
      d_pos_x: 84.0
      d_pos_y: 84.0
      d_pos_z: 84.0
      # 2*sqrt(60) = 15.5. The previous 13.4 was 2*sqrt(45) — critical for a k_rot of 45,
      # inherited from a Panda profile, which left this bench at zeta 1.5 against its actual
      # k_rot of 20: 50% overdamped, and a direct cause of laggy orientation.
      d_rot_x: 15.5
      d_rot_y: 15.5
      d_rot_z: 15.5

      error_clip:
        x: 0.1
        y: 0.1
        z: 0.1
        rx: 0.5
        ry: 0.5
        rz: 0.5

    nullspace:
      # 30, 19 Sep 2026 (was 5). At 5 Nm/rad the elbow was held by friction, not by this term:
      # sessions 20260919-135802 and -141547 both drifted up to 30 deg off q_ref (A1 -20 /
      # A3 +24) with |tau_nullspace| never above 2.5 Nm, against ~8 Nm A1 breakaway (7.9 Nm
      # commanded, 0.07 Nm on the sensor, dq=0). Both reached the same wrong posture at sample
      # ~50k, where the plan's +x needs mostly A1, and aborted at 40 mm -- at 900 and at 1300
      # N/m alike. 30 gives 10.5 Nm at 20 deg, under the 14 Nm max_tau.
      stiffness: 30.0
      # 2*sqrt(30) = 11. The dragging at the old 10.0 was zeta 2.24 against stiffness 5, not
      # the damping's size; this is zeta 1.
      damping: 11.0
      # Was 3.0, which could not do the job this term exists for. Measured from a bag of an
      # autonomous excitation run (excite_02, 2026-09-16), peak per joint:
      #
      #     tau_task        9.7  11.2   6.8  11.2   5.6   9.7   8.1  Nm
      #     tau_nullspace   1.5   1.0   1.9   0.0   2.7   0.4   1.6  Nm
      #
      # The nullspace term was outgunned roughly 5:1 by the task term, so the redundant degree
      # of freedom was not controlled by anything: a commanded POSE does not pin the wrist, and
      # with target_joint unable to hold it either, A7 wandered to -175.1 deg against a +/-175
      # limit and tripped the hardware stop — while being commanded no further than -129.5.
      #
      # 10 Nm puts the achievable nullspace torque at ~14 Nm, above the 11.2 Nm peak task
      # torque, so the term can actually hold the configuration it is given. Offline over 200
      # sampled configurations this takes the fraction where gravity alone defeats the term
      # from 48% to 0%, which is also what the excitation data needs: at 3 Nm the arm's
      # configurations collapse onto a 6-D sheet inside a 7-D space.
      #
      # It is 5% of the 200 Nm joint effort limit. It DOES make the elbow noticeably stiffer to
      # push by hand, which matters because this is the deployment controller too.
      #
      # 14 = 10 * 1300/900, 19 Sep 2026: the task term scaled with k_pos, so the 11.2 Nm peak
      # above is ~16 Nm now, and this term keeps the same ratio to it.
      max_tau: 14.0

    joint_limit_repulsion:
      enabled: true
      # Engage earlier: 0.15 rad is 8.6 deg of runway to stop a joint the task term is pushing.
      safe_range: 0.25
      # Was 3.0, and in the same bag it sat pinned at exactly 3.00 Nm on A7 while the task term
      # pushed with 8.11 Nm — saturated, losing, and the only thing standing between the plan
      # and the stop. A guard capped below the force it has to resist is not a guard. 15 Nm
      # clears the 11.2 Nm peak task torque with margin.
      #
      # 22, 19 Sep 2026: k_pos 900 -> 1300 scales that peak to ~16 Nm, which 15 would no longer
      # clear. 22 keeps the same 1.34x margin.
      max_torque: 22.0

    # Without this, crisp clamps k_pos to its 900 N/m default ceiling, silently.
    variable_max_stiffness:
      translational: 1300.0
      rotational: 60.0

    max_delta_tau: 2.0
    limit_error: false
    limit_torques: true
    use_friction: false
    # FRI torque commands are overlays on KUKA's joint-impedance controller.
    # Do not duplicate the robot controller's model compensation here.
    use_coriolis_compensation: false
    use_gravity_compensation: false
    use_local_jacobian: true

    # This controller publishes nothing — no reference, no error, no commanded torque — so
    # introspection is the ONLY way to read what it is actually tracking. It registers
    # error_0..5 (the task error that generates the torque), target_position_*/orientation_*,
    # tau_task_*, tau_desired_*, q_target_* and q_ref_*, on
    # /lbr/controller_manager/introspection_data/{names,values}.
    #
    # Needed because a learned free-space torque model is fed the command error, and the
    # alternative — logging the target we publish ourselves — records a staircase at the
    # teleop's publish rate rather than the reference the impedance law used, which an LSTM
    # will happily memorise as a clock.
    #
    # It is read in on_configure (cartesian_controller.cpp:474), so setting the parameter on
    # a configured controller does nothing: it takes effect on the next configure.
    enable_introspection: true

/**/joint_impedance_controller:
  ros__parameters:
    joints:
      - lbr_A1
      - lbr_A2
      - lbr_A3
      - lbr_A4
      - lbr_A5
      - lbr_A6
      - lbr_A7
    end_effector_frame: lbr_link_ee
    base_frame: lbr_link_0

    # Matches the Cartesian controller rather than inheriting CRISP's 0.5
    # defaults. alpha weights the PREVIOUS value, so 0.2 keeps 20% of it: light
    # smoothing, ~1.2 ms time constant at 500 Hz. Lag is what costs phase
    # margin here, so filter no more than necessary.
    filter:
      q: 0.2
      dq: 0.2
      q_ref: 0.2
      target_pose: 0.1
      output_torque: 0.2

    # Zero task gains: this controller is pure joint-space impedance, so the
    # Cartesian error and its clip play no part.
    task:
      k_pos_x: 0.0
      k_pos_y: 0.0
      k_pos_z: 0.0
      k_rot_x: 0.0
      k_rot_y: 0.0
      k_rot_z: 0.0

    # With projector_type "none" the projector is the identity, so this block
    # is the whole controller: tau = k*w*(q_ref - q) + d*w*(dq_ref - dq), with
    # the same weight vector scaling both.
    #
    # Per-joint stiffness is stiffness * weight: 20, 20, 15, 15, 8, 5, 3 Nm/rad.
    #
    # Damping is set explicitly. Left at -1, CRISP computes 2*sqrt(k_j), which
    # assumes an inertia of 1 kg m^2 at every joint. The iiwa14's proximal
    # joints carry roughly 4-5 kg m^2 and its distal ones under 0.5, so the
    # auto value under-damps A1-A4 by more than a factor of two. Critical
    # damping is 2*sqrt(k_j * I_j), which for A1 at 20 Nm/rad and ~5 kg m^2 is
    # about 20 rather than the 8.9 the formula gives.
    #
    # damping * weight = 20, 20, 15, 15, 8, 5, 3 N m s/rad, so the proximal
    # joints land near critical and the distal ones are deliberately
    # overdamped. They carry little inertia and are where measurement noise is
    # worst.
    #
    # Unlike the Cartesian case this is a renderable impedance: 20 Nm/rad is an
    # order of magnitude softer than Sunrise's 200 Nm/rad joint impedance
    # underneath, so the series compliance is not the binding constraint.
    nullspace:
      stiffness: 1.0
      damping: 1.0
      projector_type: none
      max_tau: 20.0
      weights:
        lbr_A1.value: 20.0
        lbr_A2.value: 20.0
        lbr_A3.value: 15.0
        lbr_A4.value: 15.0
        lbr_A5.value: 8.0
        lbr_A6.value: 5.0
        lbr_A7.value: 3.0

    joint_limit_repulsion:
      enabled: true
      safe_range: 0.15
      max_torque: 3.0

    # Per joint, per control cycle. At the 500 Hz update rate 2.0 is 1000 Nm/s.
    # The old 0.2 was 100 Nm/s, and a rate limit that low delays a reversing
    # damping torque by a large fraction of the oscillation period, which turns
    # damping into a destabilising lag exactly when the error is large. That is
    # what produced the overshoot-above-a-threshold behaviour in the Cartesian
    # controller, and this controller had it five times worse.
    max_delta_tau: 2.0
    limit_error: false
    limit_torques: true
    use_friction: false
    use_coriolis_compensation: false
    use_gravity_compensation: false
    use_local_jacobian: true

    # Same reasoning as the Cartesian entry above. Here q_ref IS the commanded joint
    # reference (projector_type: none makes the nullspace term the whole law), so
    # introspection is also what would make a joint-space command channel readable.
    enable_introspection: true
