# This file must match the FRI client SDK selected when running setup.
# The lab cabinet runs Sunrise.OS 1.17.1, so the default is FRI 1.17.
# Change both numbers for another supported SDK.
fri_client_sdk:
  major_version: 1
  minor_version: 17

# CRISP writes joint torque overlays. The smartPAD LBRServer must use TORQUE
# client command mode and JOINT_IMPEDANCE_CONTROL.
client_command_mode: torque
port_id: 30200
remote_host: INADDR_ANY
rt_prio: 80

# The position passthrough controller continuously mirrors measured positions.
joint_position_tau: 0.004

command_guard:
  variant: safe_stop

state_guard:
  # DISABLED 21 Sep 2026 for the UMI half of the bare-vs-UMI corpus, by the operator's choice.
  # The UMI is deliberately NOT declared to Sunrise (payload must be the only variable between the
  # bare and loaded sessions), so its weight reads as external torque: A2 3.96 Nm at activation
  # against the 2.0 Nm limit, and the node aborts. The limit is one scalar for all seven joints
  # (system_interface.cpp:37). Nothing is checked at activation while this is false -- a hand on
  # the arm or a snagged cable goes unnoticed. SET IT BACK TO true when the UMI comes off.
  external_torque_safety_check: false
  external_torque_limit: 2.0

external_torque_tau: 0.01
measured_torque_tau: 0.01
open_loop: false
