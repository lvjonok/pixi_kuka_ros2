# Must be the FRI version of Sunrise.OS and of the client SDK that setup builds
# (repos/repos-fri-1.17.yaml).
fri_client_sdk:
  major_version: 1
  minor_version: 17

# CRISP writes joint torque overlays: the Sunrise application must run the TORQUE client command
# mode under a joint impedance control mode, as sunrise/FRITorqueDriver.java does.
client_command_mode: torque
port_id: 30200
remote_host: INADDR_ANY
rt_prio: 80

joint_position_tau: 0.004

command_guard:
  variant: safe_stop

state_guard:
  # lbr_fri_ros2 checks this once, when FRI starts commanding. A tool passes only with its load
  # declared in Sunrise: declare the load, do not raise the limit. The flag is ignored upstream;
  # only the limit acts.
  external_torque_safety_check: true
  external_torque_limit: 2.0

external_torque_tau: 0.01
measured_torque_tau: 0.01
open_loop: false
