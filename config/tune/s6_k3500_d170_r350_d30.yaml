# Sweep 6 (26 Sep 2026): small motions. The first gripper session found the arm unresponsive to
# small hand movements. Stiffer, damping raised with it (same damping ratio ~0.8): friction residual x0.7, lag (d+~100)/k = 77 ms.
# Scored by track_tune.py's fine metrics (hold error, small-move delay) on a recording of small
# moves, against launch.yaml.
/lbr/cartesian_impedance_controller:
  ros__parameters:
    variable_max_stiffness: {translational: 3500.0, rotational: 1000.0}
    task:
      {k_pos_x: 3500.0, k_pos_y: 3500.0, k_pos_z: 3500.0, d_pos_x: 170.0, d_pos_y: 170.0, d_pos_z: 170.0,
       k_rot_x: 350.0, k_rot_y: 350.0, k_rot_z: 350.0, d_rot_x: 30.0, d_rot_y: 30.0, d_rot_z: 30.0}
    nullspace: {stiffness: 30.0, damping: 11.0}
    filter: {target_pose: 0.9}
  replay: {lead: false, max_error_m: null}
