# Sweep 6 (26 Sep 2026): launch.yaml with the nullspace spring off (damping kept): does the posture
# spring (30 Nm/rad toward the arming posture, 8-15 Nm on A3/A7 after teleop) hold the tool off target?
/lbr/cartesian_impedance_controller:
  ros__parameters:
    variable_max_stiffness: {translational: 2500.0, rotational: 1000.0}
    task:
      {k_pos_x: 2500.0, k_pos_y: 2500.0, k_pos_z: 2500.0, d_pos_x: 140.0, d_pos_y: 140.0, d_pos_z: 140.0,
       k_rot_x: 250.0, k_rot_y: 250.0, k_rot_z: 250.0, d_rot_x: 25.0, d_rot_y: 25.0, d_rot_z: 25.0}
    nullspace: {stiffness: 0.0, damping: 11.0}
    filter: {target_pose: 0.9}
  replay: {lead: false, max_error_m: null}
