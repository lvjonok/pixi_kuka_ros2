# More damping with the lead that cancels its lag (D/K 100 ms).
/lbr/cartesian_impedance_controller:
  ros__parameters:
    variable_max_stiffness: {translational: 2500.0, rotational: 100.0}
    task:
      {k_pos_x: 1300.0, k_pos_y: 1300.0, k_pos_z: 1300.0, d_pos_x: 130.0, d_pos_y: 130.0, d_pos_z: 130.0,
       k_rot_x: 100.0, k_rot_y: 100.0, k_rot_z: 100.0, d_rot_x: 25.0, d_rot_y: 25.0, d_rot_z: 25.0}
  replay: {lead: true, max_error_m: null}
