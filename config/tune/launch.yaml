# What controllers_umi.yaml launches: since the evening of 26 Sep 2026 translation 4000/200 (sweep 7,
# against joint friction; was 2500/140, the feel set with more damping). The --restore set.
# the damping sweep 5 removed (LBRServer 0.7 -> 0.3, crisp d 84 -> 60, d_rot 20 -> 10) given back
# in crisp, and the 30 Hz target steps (up to 8 mm) ramped over ~20 ms by the target filter
# (EMA weight on the PREVIOUS value, per 2 ms cycle; 0.1 at launch). Predicted lag ~85 / ~100 ms.
/lbr/cartesian_impedance_controller:
  ros__parameters:
    variable_max_stiffness: {translational: 4000.0, rotational: 1000.0}
    task:
      {k_pos_x: 4000.0, k_pos_y: 4000.0, k_pos_z: 4000.0, d_pos_x: 200.0, d_pos_y: 200.0, d_pos_z: 200.0,
       k_rot_x: 250.0, k_rot_y: 250.0, k_rot_z: 250.0, d_rot_x: 25.0, d_rot_y: 25.0, d_rot_z: 25.0}
    nullspace: {stiffness: 30.0, damping: 11.0}
    filter: {target_pose: 0.9}
  replay: {lead: false, max_error_m: null}
