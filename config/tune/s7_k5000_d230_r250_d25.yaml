# Sweep 7 (26 Sep 2026): stiff translation, launch rotation. Sweep 6b (steps1, 1-3 mm / 0.5-2 deg
# steps) showed the hold offset is joint friction, ~15 N at the tool whatever k is: 6.0 / 4.8 /
# 2.9 mm at k 2500 / 3500 / 5000, small-step delay 405 / 140 / 110 ms. 5000 was stable in
# translation; its rotation (450/38) oscillated on a 2 deg step (A5/A7, then A3 at 81 %), so
# rotation stays at launch's 250/25, stable through the same steps.
/lbr/cartesian_impedance_controller:
  ros__parameters:
    variable_max_stiffness: {translational: 5000.0, rotational: 1000.0}
    task:
      {k_pos_x: 5000.0, k_pos_y: 5000.0, k_pos_z: 5000.0, d_pos_x: 230.0, d_pos_y: 230.0, d_pos_z: 230.0,
       k_rot_x: 250.0, k_rot_y: 250.0, k_rot_z: 250.0, d_rot_x: 25.0, d_rot_y: 25.0, d_rot_z: 25.0}
    nullspace: {stiffness: 30.0, damping: 11.0}
    filter: {target_pose: 0.9}
  replay: {lead: false, max_error_m: null}
