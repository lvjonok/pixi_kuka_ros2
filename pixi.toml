[workspace]
authors = ["Lev Kozlov <kozlov.l.a10@gmail.com>"]
name = "pixi_kuka_ros2"
version = "0.1.0"
channels = ["https://fast.prefix.dev/conda-forge"]
platforms = ["linux-64"]

[activation]
scripts = ["scripts/set_ros_env.sh"]

[dependencies]
python = "*"
compilers = "*"
cmake = "*"
pkg-config = "*"
make = "*"
ninja = "*"
numpy = "<=2.3"
vcstool = "*"

[target.linux.dependencies]
libgl-devel = "*"

[environments]
jazzy = { features = ["jazzy", "dev"] }

[feature.jazzy]
channels = ["https://prefix.dev/robostack-jazzy"]

[feature.jazzy.dependencies]
colcon-common-extensions = "*"
pinocchio = ">=3.7.0,<4"
ros-jazzy-desktop = "*"
ros-jazzy-generate-parameter-library = "*"
ros-jazzy-rmw-cyclonedds-cpp = "*"
ros-jazzy-ros2-control = "*"
ros-jazzy-ros2-controllers = "*"
ros-jazzy-xacro = ">=2.0.13,<3"

[feature.jazzy.tasks]
sources = "bash scripts/import_sources.sh"
build = { cmd = "colcon build --base-paths . src --packages-up-to pixi_kuka_ros2 --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -Wno-dev", depends-on = ["sources"] }
setup = { depends-on = ["build"] }
mock = "ros2 launch pixi_kuka_ros2 crisp_mock.launch.py"
mock-loopback = "env CYCLONEDDS_URI=file://$PWD/config/cyclonedds_loopback.xml ros2 launch pixi_kuka_ros2 crisp_mock.launch.py"
hardware = "ros2 launch pixi_kuka_ros2 crisp_hardware.launch.py"
controllers = "ros2 control list_controllers -c /lbr/controller_manager"
interfaces = "ros2 control list_hardware_interfaces -c /lbr/controller_manager"
session = "env CYCLONEDDS_URI=file://$PWD/config/cyclonedds_loopback.xml python scripts/crisp_session.py"

[feature.dev.pypi-dependencies]
crisp-python = ">=3.0.0,<4"
filelock = ">=3.20,<4"
pytest = "*"
ruff = "*"
# The dataset recorder for the external-torque experiment. It lives in its own repository
# because it is an experiment, not part of the cell — but it has to run HERE: this is the
# only environment carrying rclpy, lbr_fri_idl and pal_statistics_msgs together, and the
# recorder needs all three (FRI state, plus CRISP introspection for the command channel).
#
# Editable and by path rather than pinned, because the recorder is under active development
# against this cell and a pin would put a release cycle between finding a recording bug and
# fixing it. Pin it once sessions are being kept: a dataset whose recorder cannot be
# identified is a dataset whose columns cannot be explained.
iiwa_next = { path = "../../iiwa_next", editable = true }
# Parquet writer for the same. Not otherwise used by this workspace.
pyarrow = ">=15"
# The live view for an autonomous excitation run: the plan drawn as a translucent ghost beside the
# arm's measured configuration. It belongs HERE and not only on the laptop, because the thing it
# exists to show is the *gap* between those two, and the measured half only exists on the machine
# talking to the cell. A PyPI wheel rather than conda: viser is pure Python with a bundled web
# client, so it has nothing to gain from the solver that also has to satisfy robostack, and every
# package added to that solve is another chance to move the ROS pins. The `urdf` extra pulls
# yourdfpy, without which `ViserUrdf` raises at construction -- so the view would die at exactly
# the moment someone started a run in order to watch it.
viser = { version = ">=0.2", extras = ["urdf"] }
# CPU torch, so `iiwa-next live` can run the trained estimator beside the arm and show the
# residual while someone pushes it. A PyPI wheel, never conda: the wheels vendor their own CUDA
# and MKL and depend only on numpy, which keeps torch out of the solver that also has to satisfy
# robostack. CPU because one 50-step window through a 300k-parameter net takes well under a
# millisecond, and the estimator runs at 100 Hz.
torch = { version = ">=2.4", index = "https://download.pytorch.org/whl/cpu" }
