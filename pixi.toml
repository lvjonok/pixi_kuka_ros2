[workspace]
authors = ["Lev Kozlov <kozlov.l.a10@gmail.com>"]
name = "pixi_kuka_ros2"
version = "0.1.0"
channels = ["https://fast.prefix.dev/conda-forge"]
platforms = ["linux-64"]

[activation]
scripts = ["scripts/set_ros_env.sh"]

[dependencies]
python = "*"
compilers = "*"
cmake = "*"
pkg-config = "*"
make = "*"
ninja = "*"
numpy = "<=2.3"
vcstool = "*"

[target.linux.dependencies]
libgl-devel = "*"

[environments]
jazzy = { features = ["jazzy"] }

[feature.jazzy]
channels = ["https://prefix.dev/robostack-jazzy"]

[feature.jazzy.dependencies]
colcon-common-extensions = "*"
pinocchio = ">=3.7.0,<4"
pyyaml = "*"
ros-jazzy-desktop = "*"
ros-jazzy-generate-parameter-library = "*"
ros-jazzy-rmw-cyclonedds-cpp = "*"
ros-jazzy-ros2-control = "*"
ros-jazzy-ros2-controllers = "*"
ros-jazzy-xacro = ">=2.0.13,<3"
scipy = "*"

[feature.jazzy.pypi-dependencies]
crisp-python = ">=3.0.0,<4"
# controller_manager's spawner imports it; the conda package does not depend on it.
filelock = ">=3.20,<4"
# Nothing here imports it: the consumer's scripts run in this environment and do.
viser = { version = ">=0.2", extras = ["urdf"] }

[feature.jazzy.tasks]
sources = "bash scripts/import_sources.sh"
build = { cmd = "colcon build --base-paths . src --packages-up-to pixi_kuka_ros2 --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -Wno-dev", depends-on = ["sources"] }
setup = { depends-on = ["build"] }
test-controllers = "colcon build --base-paths . src --packages-select pixi_kuka_ros2 --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -Wno-dev && colcon test --base-paths . src --packages-select pixi_kuka_ros2 --event-handlers console_direct+ && colcon test-result --test-result-base build/pixi_kuka_ros2 --verbose"
hardware = "ros2 launch pixi_kuka_ros2 crisp_hardware.launch.py"
hardware-umi = "ros2 launch pixi_kuka_ros2 crisp_hardware.launch.py tool:=umi"
mock-loopback = "env ROS_DOMAIN_ID=77 CYCLONEDDS_URI=file://$PWD/config/cyclonedds_loopback.xml ros2 launch pixi_kuka_ros2 crisp_mock.launch.py"
controllers = "ros2 control list_controllers -c /lbr/controller_manager"
interfaces = "ros2 control list_hardware_interfaces -c /lbr/controller_manager"
session = "env ROS_DOMAIN_ID=77 CYCLONEDDS_URI=file://$PWD/config/cyclonedds_loopback.xml python scripts/crisp_session.py"
check-mock = "env ROS_DOMAIN_ID=77 CYCLONEDDS_URI=file://$PWD/config/cyclonedds_loopback.xml python scripts/position_source_mock_check.py"
